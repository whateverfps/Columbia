const stage=document.getElementById('stage'),progress=document.getElementById('progress'),stepname=document.getElementById('stepname'),count=document.getElementById('count');let idx=0,timer=null,auto=false;
chapters.forEach((c,i)=>{const el=document.createElement('section');el.className='chapter';el.innerHTML=`<div class="copy"><div class="eyebrow">${c.kicker}</div><h1>${c.title}</h1><p>${c.desc}</p><div class="why">${c.why}</div></div><div class="visual">${c.visual}<a class="open-role" href="${c.role}">${i===chapters.length-1?'Open Vision Hub':'Open this role world'} →</a></div>`;stage.appendChild(el);const d=document.createElement('i');d.className='dot';d.title=c.name;d.onclick=()=>show(i);progress.appendChild(d)});
function show(n){idx=(n+chapters.length)%chapters.length;[...stage.children].forEach((e,i)=>e.classList.toggle('active',i===idx));[...progress.children].forEach((e,i)=>e.classList.toggle('active',i===idx));stepname.textContent=chapters[idx].name;count.textContent=`${idx+1} / ${chapters.length}`;if(auto)restart()}
function restart(){clearTimeout(timer);timer=setTimeout(()=>{if(idx===chapters.length-1){auto=false;document.getElementById('auto').textContent='▶ Auto Play';return}show(idx+1)},6500)}
document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('auto').onclick=e=>{auto=!auto;e.currentTarget.textContent=auto?'❚❚ Pause':'▶ Auto Play';clearTimeout(timer);if(auto)restart()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(idx+1);if(e.key==='ArrowLeft')show(idx-1);if(e.key==='Escape')location.href='pauls-vision.html'});show(0);
